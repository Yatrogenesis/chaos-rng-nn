name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy, warnings are errors
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The Phase 0 battery runs here as a test, not as a loose script, so a
      # regression in the generator fails the build.
      - name: Tests
        run: cargo test --workspace --release

      - name: Phase 0 gate
        run: cargo run --release -p experiment -- phase0

      # Phase 8 exits non-zero if the reservoir calibration fails, and the
      # committed results must reproduce byte for byte from the seeds.
      - name: Phase 8 gate and reproducibility
        run: |
          cargo run --release -p reservoir --bin phase8
          git diff --exit-code results/phase8_reservoir.json

  # Phase 7 depends on an external read-only reference, so it is verified in its
  # own job. The reference is cloned at a pinned commit and never modified; the
  # final step asserts that, so that a change to it would fail the build rather
  # than pass unnoticed.
  kirs-pilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: chaos-rng-nn
      - uses: actions/checkout@v4
        with:
          repository: Yatrogenesis/kirs
          ref: 18a727649f455b1aa332f99057a2a2f747ce769c
          path: kirs-readonly
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: chaos-rng-nn/crates/kirs-pilot

      - name: Format
        working-directory: chaos-rng-nn
        run: cargo fmt --manifest-path crates/kirs-pilot/Cargo.toml -- --check

      - name: Clippy, warnings are errors
        working-directory: chaos-rng-nn
        run: cargo clippy --manifest-path crates/kirs-pilot/Cargo.toml --all-targets -- -D warnings

      - name: Tests
        working-directory: chaos-rng-nn
        run: cargo test --release --manifest-path crates/kirs-pilot/Cargo.toml

      - name: Classification reproduces the committed result
        working-directory: chaos-rng-nn
        run: |
          cargo run --release --manifest-path crates/kirs-pilot/Cargo.toml --bin classify
          git diff --exit-code results/phase7_applicability.json

      - name: The reference was not modified
        working-directory: kirs-readonly
        run: |
          test -z "$(git status --porcelain)" || { git status --porcelain; exit 1; }
          test "$(git rev-parse HEAD)" = "18a727649f455b1aa332f99057a2a2f747ce769c"

  # Phase 9 takes several minutes, so it runs as its own job rather than
  # lengthening the main one. It exits non-zero if the check against the
  # backpropagation gradient fails, and the committed results must reproduce
  # byte for byte from the seeds.
  phase9:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Phase 9 gate and reproducibility
        run: |
          cargo run --release -p predictive-coding --bin phase9
          git diff --exit-code results/phase9_predictive_coding.json

  # Phase 10 sweeps five hyperparameter settings and is the longest job, so it
  # runs on its own. It exits non-zero if the topological measure fails to
  # separate structure from noise, and the committed results must reproduce.
  phase10:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Phase 10 gate and reproducibility
        run: |
          cargo run --release -p topo-plasticity --bin phase10
          git diff --exit-code results/phase10_topo_plasticity.json

  # Phase 11 repeats the Phase 9 comparison at four offsets, so it runs on its
  # own. It exits non-zero if the offset mechanism fails its verification, and
  # the committed results must reproduce byte for byte from the seeds.
  phase11:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Phase 11 gate and reproducibility
        run: |
          cargo run --release -p predictive-coding --bin phase11
          git diff --exit-code results/phase11_shared_trajectory.json
