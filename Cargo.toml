[workspace]
resolver = "2"
members = [
    "crates/chaos-rng",
    "crates/xstats",
    "crates/experiment",
    "crates/reservoir",
    "crates/predictive-coding",
]

# kirs-pilot is deliberately not a member. It depends by path on a separate
# read-only clone of github.com/Yatrogenesis/kirs, which is not part of this
# repository, so including it here would make `cargo test --workspace` fail for
# anyone who has not cloned that reference. Excluding it keeps this workspace
# self-contained and buildable from a fresh clone; the pilot is built
# explicitly, and CI verifies it in a job that clones kirs at the pinned commit.
# See crates/kirs-pilot/README.md.
exclude = ["crates/kirs-pilot"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
authors = ["Francisco Molina Burgos <pako.molina@gmail.com>"]
repository = "https://github.com/Yatrogenesis/chaos-rng-nn"

# Exact versions, no caret ranges. Resolved from the crates.io sparse index on
# 2026-08-13 and pinned deliberately so a rebuild years from now resolves the
# same dependency graph.
[workspace.dependencies]
chaos-rng = { path = "crates/chaos-rng" }
xstats = { path = "crates/xstats" }
reservoir = { path = "crates/reservoir" }
experiment = { path = "crates/experiment" }
rand = "=0.9.5"
rand_chacha = "=0.10.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
csv = "=1.4.0"
plotters = { version = "=0.3.7", default-features = false, features = ["bitmap_backend", "bitmap_encoder", "line_series", "ab_glyph"] }
sha2 = "=0.11.0"
tda = "=0.1.0"
nalgebra = "=0.33.3"
# The author's own FFT crate, per the reuse preference. It delegates to a
# mixed-radix implementation for lengths that are not powers of two, which is
# required here: the vectors are 2178 wide.
yatrosci-fft = "=0.1.0"
ndarray = "=0.16.1"
num-complex = "=0.4.6"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
