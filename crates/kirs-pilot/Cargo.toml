[package]
name = "kirs-pilot"
description = "Formal verification of which Pesin-type formula has its hypotheses satisfied, per generator family, by Horn resolution"
# Not inherited from the workspace: this crate is excluded from it, for the
# reason recorded in the root manifest.
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
authors = ["Francisco Molina Burgos <pako.molina@gmail.com>"]
repository = "https://github.com/Yatrogenesis/chaos-rng-nn"

# kirs is consumed as a read-only reference. Nothing inside that checkout is
# edited by this project, and its source is not vendored here: these are path
# dependencies into a separate clone, so a change of pinned version is a change
# to this file and never to that repository.
#
# Pinned at kirs commit 18a7276. If that clone is absent, this crate does not
# build, which is the intended failure: it makes the external dependency
# visible rather than silently stale.
[dependencies]
pirs-kirs = { path = "../../../kirs-readonly/pirs-kirs" }
kirs-lab = { path = "../../../kirs-readonly/kirs-lab" }

[lints.rust]
missing_docs = "warn"
